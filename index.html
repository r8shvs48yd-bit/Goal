<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title> Planner </title>
<style>
:root{--pink:#f8e7ed;--pink2:#f3d6e0;--cream:#fffaf4;--yellow:#f5edcf;--ink:#a18a88;--line:#f0e1e4}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.5 system-ui;padding:16px}.app{max-width:1050px;margin:auto}header,.card{background:#fffdfb;border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:14px}header{background:linear-gradient(130deg,var(--pink),#fff8f1)}h1,h2,h3{font-family:Georgia;color:#bb929f;font-weight:500;margin:0 0 10px}h1{font-size:38px}nav{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0}button{background:#fffdfb;border:1px solid var(--line);border-radius:13px;padding:9px 13px;color:#a88b95;cursor:pointer}button.active,button:hover{background:var(--pink2)}.pill{background:var(--yellow)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.muted{font-size:13px;color:#b49c9b}.field{width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fffdfa;margin:5px 0 9px;font:inherit}textarea.field{min-height:90px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row .field{flex:1}.task{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid #f7eef0;align-items:flex-start}.task input{accent-color:#d6a8b8;margin-top:4px}.done span{text-decoration:line-through;opacity:.55}.progress{height:8px;background:#f8edf0;border-radius:20px;margin:9px 0;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,#edc9d6,#f2e7bd)}.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:55px}.selected{background:var(--pink2)}.dot{color:#d5a6b7}.tag{font-size:11px;background:#fbf0f3;border-radius:20px;padding:3px 8px}.empty{padding:15px;text-align:center;border:1px dashed var(--line);border-radius:12px}.danger{background:#fbefed}footer{text-align:center;font-size:12px;color:#bea8a7}@media(max-width:650px){.grid{grid-template-columns:1fr}body{padding:10px}h1{font-size:30px}}
</style><body><div class="app"><header><h1> Planner </h1><div>A little progress every day.</div><div class="muted" id="date"></div></header><nav id="nav"><button data-p="daily" class="active">☁ Daily</button><button data-p="weekly">♡ Weekly</button><button data-p="calendar">▦ Calendar</button><button data-p="todo">✿ To-do list</button><button data-p="goals">☆ Overall goals</button><button data-p="brain">☼ Brain dump</button><button data-p="journal">♡ Progress journal</button></nav><main id="app"></main><footer>Soft plans, small steps, and room to be human ♡<br>Saved in this browser. Export a backup to keep a copy.</footer></div>
<script>
const $=s=>document.querySelector(s),today=()=>{let d=new Date();return d.toISOString().slice(0,10)},nice=s=>new Date(s+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let base={daily:{},weekly:{},events:{},todos:[],brain:[],journal:[],checks:{},goals:[['Work',['Build a daily 15-minute discipline habit (reading, writing, drawing or yoga/Pilates)','Try 3–4 low-stakes resilience experiments and reflect','Explore two hobbies or topics and find something interesting to share']],['Physical',['Gym on Monday and Friday, with a shorter backup option','Build a simple five-minute morning and night hygiene routine','Create a hair wash-day and skincare routine']],['Self-expression',['Practise 2–3 new makeup techniques','Make a mood board and look for common themes','Discover 5–10 new artists or albums','Finish my room by 1 January 2027: posters, fairy lights and whiteboard']],['Self-sufficiency',['Finish a one-page résumé','Apply for 1–2 suitable jobs each week','Practise interview questions using examples from rugby, refereeing and school']]],milestones:[{t:'Finish my room',d:'2027-01-01',v:false}]};
let D;try{D=JSON.parse(localStorage.getItem('littlePlanner'))||structuredClone(base)}catch{D=structuredClone(base)}function save(){localStorage.setItem('littlePlanner',JSON.stringify(D))}
function row(t,k,typ,day=''){let v=typ==='goal'?D.checks[k]:D[typ][day]?.[k];return `<div class="task ${v?'done':''}"><input type="checkbox" ${v?'checked':''} onchange="toggle('${typ}','${day}','${k}',this.checked)"><span>${esc(t)}</span></div>`}
function toggle(typ,day,k,v){if(typ==='goal')D.checks[k]=v;else{D[typ][day]=D[typ][day]||{};D[typ][day][k]=v}save();render()}
function page(p){document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===p));({daily,weekly,calendar,todo,goals,brain,journal})[p]()}
function daily(){let d=today(),a=['Morning: wash face, brush teeth and floss','Night: brush teeth, floss and wind down','Choose one 15-minute discipline habit'];$('#app').innerHTML=`<div class="grid"><section class="card"><h2>Daily checklist ♡</h2><p class="muted">${nice(d)}</p>${a.map((t,i)=>row(t,'d'+i,'daily',d)).join('')}<p class="muted">Choose one: reading, writing, drawing or yoga/Pilates.</p></section><section class="card"><h2>A little overview</h2><p class="muted">Small steps count.</p><div class="progress"><span style="width:${a.filter((x,i)=>D.daily[d]?.['d'+i]).length/a.length*100}%"></span></div><button onclick="page('todo')">Today's one-off to-dos →</button></section></div><section class="card"><h3>Today's calendar plans</h3>${(D.events[d]||[]).map(e=>`<div class="task">${esc(e.t)}</div>`).join('')||'<div class="empty">Nothing scheduled yet.</div>'}<button onclick="page('calendar')">Open calendar</button></section>`}
function weekly(){let d=new Date();d.setDate(d.getDate()-(d.getDay()+6)%7);let key=d.toISOString().slice(0,10),a=['Gym session — Monday','Gym session — Friday','Apply for 1–2 suitable jobs if available','Explore a hobby or topic','Weekly reflection'];$('#app').innerHTML=`<section class="card"><h2>Weekly checklist ♡</h2>${a.map((t,i)=>row(t,'w'+i,'weekly',key)).join('')}<p class="muted">Tick these off as you go; no weekly reset required.</p></section><section class="card"><h3>Your week at a glance</h3><div class="row">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<span class="tag">${x}</span>`).join('')}</div><button onclick="page('calendar')">Plan in calendar →</button></section>`}
let monthDate=new Date(),selected=today();function calendar(){let y=monthDate.getFullYear(),m=monthDate.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),s='';for(let i=0;i<off;i++)s+='<span></span>';for(let i=1;i<=n;i++){let d=`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;s+=`<button class="day ${d===selected?'selected':''}" onclick="pick('${d}')">${i}${D.events[d]?.length?' <i class=dot>•</i>':''}</button>`}$('#app').innerHTML=`<section class="card"><div class="row"><button onclick="month(-1)">‹</button><h2 style="flex:1;text-align:center">${monthDate.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><button onclick="month(1)">›</button></div><div class="daygrid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<span class="muted">${x}</span>`).join('')}${s}</div></section><section class="card"><h2>${nice(selected)}</h2>${(D.events[selected]||[]).map((e,i)=>`<div class="task"><span style="flex:1">${esc(e.t)}</span><button class="danger" onclick="delEvent(${i})">×</button></div>`).join('')}<h3>Add a plan</h3><input id="ev" class="field" placeholder="Appointment, plans, lashes..."><div class="row"><select id="type" class="field"><option>Personal</option><option>Work</option><option>Physical</option><option>Self-expression</option><option>Self-sufficiency</option></select><button onclick="addEvent()">Add +</button></div><p class="muted">Calendar items are separate from goal checklists.</p></section>`}
function month(n){monthDate.setMonth(monthDate.getMonth()+n);calendar()}function pick(d){selected=d;calendar()}function addEvent(){let t=$('#ev').value.trim();if(!t)return;D.events[selected]=D.events[selected]||[];D.events[selected].push({t,type:$('#type').value});save();calendar()}function delEvent(i){D.events[selected].splice(i,1);save();calendar()}
function todo(){let d=today();$('#app').innerHTML=`<section class="card"><h2>Everyday to-do list ✿</h2><p class="muted">One-off tasks, separate from your goals and goal progress.</p><div class="row"><input id="tt" class="field" placeholder="Add a task..."><input id="td" type="date" class="field" value="${d}"><button onclick="addTodo()">Add +</button></div><h3>For today</h3>${D.todos.filter(t=>t.d===d).map(todoRow).join('')||'<div class="empty">No one-off tasks today ♡</div>'}<h3>Upcoming / unscheduled</h3>${D.todos.filter(t=>t.d!==d&&!t.done).map(todoRow).join('')||'<div class="empty">No other tasks.</div>'}</section>`}
function todoRow(t){return `<div class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="todoToggle('${t.id}',this.checked)"><span style="flex:1">${esc(t.t)} <span class="muted">${esc(t.d||'No date')}</span></span><button onclick="todoDel('${t.id}')">×</button></div>`}function addTodo(){let t=$('#tt').value.trim();if(!t)return;D.todos.push({id:Date.now()+'',t,d:$('#td').value,done:false});save();todo()}function todoToggle(id,v){let t=D.todos.find(x=>x.id===id);if(t)t.done=v;save();todo()}function todoDel(id){D.todos=D.todos.filter(x=>x.id!==id);save();todo()}
function goals(){let all=D.goals.flatMap(g=>g[1]);$('#app').innerHTML=`<section class="card"><h2>Overall goals ☆</h2><p class="muted">Bigger goals at your own pace.</p><div class="progress"><span style="width:${all.filter((x,i)=>D.checks['g'+i]).length/all.length*100}%"></span></div></section><div class="grid">${D.goals.map((g,gi)=>`<section class="card"><h2>${g[0]}</h2>${g[1].map((t,i)=>row(t,'g'+(D.goals.slice(0,gi).reduce((n,x)=>n+x[1].length,0)+i),'goal')).join('')}</section>`).join('')}</div><section class="card"><h2>Milestones ♡</h2>${D.milestones.map((m,i)=>`<div class="task"><input type="checkbox" ${m.v?'checked':''} onchange="mileToggle(${i},this.checked)"><span>${esc(m.t)} <span class="muted">${esc(m.d)}</span></span></div>`).join('')}<div class="row"><input id="mt" class="field" placeholder="Add milestone"><input id="md" type="date" class="field"><button onclick="mileAdd()">Add +</button></div></section>`}
function mileToggle(i,v){D.milestones[i].v=v;save();goals()}function mileAdd(){let t=$('#mt').value.trim();if(!t)return;D.milestones.push({t,d:$('#md').value,v:false});save();goals()}
function brain(){let items=D.brain.slice().reverse().map((b,r)=>`<div class="task"><span style="flex:1"><b>${b.kind==='video'?'Video inspiration':'Thought'}</b> ${esc(b.t)}<div class="muted">${esc(b.note||'')} ${esc(b.file||'')}</div>${b.url?`<a href="${esc(b.url)}" target="_blank" rel="noopener">Open video</a>`:''}</span><button onclick="brainDel(${D.brain.length-1-r})">×</button></div>`).join('');$('#app').innerHTML=`<section class="card"><h2>Brain dump ☼</h2><p class="muted">Random thoughts, ideas, reminders or anything to remember.</p><textarea id="bt" class="field" placeholder="Get it out of your head..."></textarea><button onclick="brainAdd()">Save thought +</button><h3 style="margin-top:20px">Video inspiration</h3><p class="muted">Add a video link or select a phone video. The website can save the filename, but does not upload/store the actual video file.</p><input id="bf" type="file" accept="video/*" class="field"><input id="bu" class="field" placeholder="Video link (optional)"><input id="bn" class="field" placeholder="Note (optional)"><button onclick="videoAdd()">Save inspiration +</button><h3 style="margin-top:20px">Saved items</h3>${items||'<div class="empty">Your thoughts and inspiration appear here.</div>'}</section>`}
function brainAdd(){let t=$('#bt').value.trim();if(t){D.brain.push({kind:'thought',t});save();brain()}}function videoAdd(){let f=$('#bf').files[0],url=$('#bu').value.trim(),note=$('#bn').value.trim();if(!f&&!url&&!note)return;D.brain.push({kind:'video',t:f?'Phone video':url||'Video note',file:f?.name||'',url,note});save();brain()}function brainDel(i){D.brain.splice(i,1);save();brain()}
function journal(){let list=D.journal.slice().reverse().map((j,r)=>`<div class="card"><b>${esc(j.d)}</b><p>${esc(j.t)}</p><button onclick="jdel(${D.journal.length-1-r})">Delete</button></div>`).join('');$('#app').innerHTML=`<section class="card"><h2>Progress journal ♡</h2><p class="muted">Notice what you're learning, what felt hard and the little wins.</p><textarea id="jt" class="field" placeholder="What went well? What did I learn?"></textarea><button onclick="jadd()">Save entry +</button><h3 style="margin-top:20px">Past entries</h3>${list||'<div class="empty">Your reflections will collect here.</div>'}</section>`}function jadd(){let t=$('#jt').value.trim();if(t){D.journal.push({t,d:nice(today())});save();journal()}}function jdel(i){D.journal.splice(i,1);save();journal()}
function backup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.href=u;a.download='life-planner-backup.json';a.click();URL.revokeObjectURL(u)}
$('#date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-p]');if(b)page(b.dataset.p)});let b=document.createElement('button');b.className='pill';b.textContent='↓ Export backup';b.onclick=backup;$('#nav').append(b);page('daily');
</script></body></html>
